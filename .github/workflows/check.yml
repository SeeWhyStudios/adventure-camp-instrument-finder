name: Check and preview proposed widget
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: proposed-widget-preview
          path: dist
          retention-days: 7
