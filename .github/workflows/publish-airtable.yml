name: Publish approved Airtable snapshot
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish reviewed Ready to Publish records to the live finder'
        type: boolean
        required: true
        default: false
concurrency:
  group: airtable-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export only approved public fields
        shell: bash
        run: |
          if [ "$PUBLISH" = 'true' ]; then
            npm run publish:airtable
          else
            npm run publish:airtable -- --dry-run
          fi
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          PUBLISH: ${{ inputs.publish }}
          AIRTABLE_BASE_ID: app6ibiy002FyCaWF
          AIRTABLE_TABLE_ID: tblIHogDJThe9G42D
          AIRTABLE_FAMILY_TABLE_ID: tblQ6p38tebi3fxKz
      - run: npm test
      - run: npm run build
      - name: Commit only changed snapshot
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/public-instruments.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/public-instruments.json
            git commit -m 'Publish approved public camp snapshot'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
# GITHUB_TOKEN pushes do not trigger a second push workflow. Calling the Pages
# workflow explicitly above ensures a changed snapshot is actually deployed.
